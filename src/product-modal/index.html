<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../bundle.css" />
    <script defer src="../bundle.js"></script>
    <title>Product Modal</title>
  </head>
  <body>
    <div class="bg-slate-100 flex justify-center items-center min-h-screen">
      <div
        class="flex flex-col space-y-4 bg-white drop-shadow-xl shadow-slate-800 rounded-xl p-6 md:flex-row md:space-y-0 md:space-x-4 md:w-180 mx-6"
      >
        <!-- Image container -->
        <div class="flex justify-center items-cente md:w-1/3">
          <img
            class="w-2/3 md:w-full md:h-1/2"
            src="./images/headphone.png"
            alt="pink and grey headphone"
          />
        </div>

        <!-- Content Container -->
        <div class="flex flex-col items-start space-y-5">
          <div class="flex flex-col space-y-2 items-start">
            <span class="text-xs text-white bg-black rounded-full px-2 py-1"
              >Free Shipping</span
            >
            <p class="text-xl text-black">
              Razer Kraken Kitty Edt Gaming Headset Quartz
            </p>
          </div>
          <div class="flex flex-col items-start space-y-1">
            <span class="text-xs line-through">$700</span>
            <h2 class="text-3xl font-bold">$599</h2>
            <p class="text-xs text-slate-400">
              THe offer is valid until April 3 or as log as stock lasts!
            </p>
          </div>
          <div
            class="w-full text-center border-b-4 bg-blue-600 hover:bg-blue-900 border-blue-900 rounded-md group"
          >
            <button
              class="p-3 bg-blue-600 text-white text-sm duration-500 rounded-md w-full group-hover:bg-blue-900 cursor-pointer"
            >
              Add to cart
            </button>
          </div>
          <div class="flex space-x-3 items-center">
            <div
              class="w-2 h-2 bg-green-500 rounded-full animate-ping delay-1000"
            ></div>
            <p class="text-xs">50+ pcs. in stock.</p>
          </div>
          <div
            class="w-full flex flex-col space-y-6 md:flex-row md:space-y-0 md:space-x-6"
          >
            <button
              class="outline-2 outline-slate-300 text-sm p-3 flex space-x-2 justify-center items-center rounded-md w-full hover:bg-slate-300 transition duration-500 cursor-pointer"
            >
              <span
                ><img
                  src="./images/weight.png"
                  class="w-6 h-6"
                  alt="Weight png"
              /></span>
              <span>Add to Cart</span></button
            ><button
              class="outline-2 outline-slate-300 text-sm p-3 flex space-x-2 justify-center items-center rounded-md w-full hover:bg-slate-300 transition duration-500 cursor-pointer"
            >
              <span
                ><img
                  class="w-6 h-6"
                  src="./images/heart.png"
                  alt="Heart images"
              /></span>
              <span>Add to wishlist</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
