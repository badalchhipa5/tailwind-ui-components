<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Subscription</title>
    <link rel="stylesheet" href="../bundle.css" />
    <script defer src="../bundle.js"></script>
  </head>
  <body>
    <div class="bg-zinc-700 h-screen flex justify-center items-center">
      <div class="bg-zinc-800 rounded-2xl p-2 mx-6">
        <div class="flex flex-col md:flex-row rounded-l-xl">
          <img
          class="h-80 md:h-64 rounded-2xl object-fit md:rounded-l-xl md:rounded-r-none hover:scale-105 hover:rounded-xl transition duration-200"
          src="./images/image.jpg"
          alt="Image for email subscribe UI "
          />
          <div>
            <div class="p-6 md:p-12">
              <h2 class="text-xl font-medium text-center text-white md:text-left">Get diet and fitness tips in your inbox</h2>
              <p class="max-w-xs my-4 text-xs leading-5 tracking-wide text-center text-white md:text-left">Eat better and exercise better. signup for daily Diet&Fitness newsletters</p>
              <div class="flex flex-col my-5 space-y-4 md:flex-row md:space-y-0 md:space-x-3">
                <input type="text" class="py-2 px-4 bg-zinc-800 border border-zinc-600 text-center text-white placeholder:md:text-left focus:outline-none" placeholder="Enter your email address">
                <button class="px-5 py-3 text-xs rounded-md text-zinc-800 bg-lime-500 hover:bg-lime-700 hover:text-white duration-500 cursor-pointer">Subscribe</button>
              </div>
            </div>
        </div>
      </div>
    </div>
  </body>
</html>
